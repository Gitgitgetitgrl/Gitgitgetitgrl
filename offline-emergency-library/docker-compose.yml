# ROM — Offline Emergency Resource Library
# Full offline stack: content library (Kiwix) + local LLM (Ollama) + vector DB (Qdrant)
# + the Rom RAG assistant. Nothing here requires the internet at runtime.
#
#   Start:  ./scripts/03-start.sh   (or: docker compose up -d)
#   Index:  docker compose exec rom python ingest.py

services:
  # ---- Content library: serves every .zim file in ./content/zim over HTTP ----
  kiwix:
    image: ghcr.io/kiwix/kiwix-tools:latest
    container_name: rom-kiwix
    restart: unless-stopped
    # kiwix-serve auto-discovers all *.zim in the mounted directory.
    command: >
      sh -c "kiwix-serve --port=8090 --address=0.0.0.0 --library /data/library.xml
             || kiwix-serve --port=8090 --address=0.0.0.0 /data/*.zim"
    volumes:
      - ./content/zim:/data:ro
    ports:
      - "${KIWIX_PORT:-8090}:8090"

  # ---- Local LLM runtime ("Rom"'s brain) ----
  ollama:
    image: ollama/ollama:latest
    container_name: rom-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    # To use an NVIDIA GPU (Tier 3), install nvidia-container-toolkit on the host
    # and uncomment the block below.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ---- Vector database for retrieval-augmented generation ----
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rom-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"

  # ---- The Rom assistant: RAG API + chat web UI ----
  rom:
    build: ./rom
    container_name: rom-assistant
    restart: unless-stopped
    depends_on:
      - ollama
      - qdrant
      - kiwix
    environment:
      OLLAMA_URL: "http://ollama:11434"
      QDRANT_URL: "http://qdrant:6333"
      KIWIX_URL: "http://kiwix:8090"
      KIWIX_PORT_PUBLIC: "${KIWIX_PORT:-8090}"
      ROM_MODEL: "${ROM_MODEL:-llama3.1:8b}"
      EMBED_MODEL: "${EMBED_MODEL:-nomic-embed-text}"
      TOP_K: "${TOP_K:-6}"
    volumes:
      - ./content:/content:ro     # library sources for ingestion (read-only)
    ports:
      - "${ROM_PORT:-8080}:8080"

  # ---- Optional: offline media server for curated videos/images ----
  # Start with:  docker compose --profile media up -d jellyfin   (http://<box>:8096)
  # Populate content/media/ first via scripts/05-download-media.sh.
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: rom-jellyfin
    restart: unless-stopped
    profiles: ["media"]
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./content/media:/media:ro
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"

  # ---- Optional: browser-based SDR receiver (needs an RTL-SDR dongle) ----
  # Start with:  docker compose --profile radio up -d openwebrx    (http://<box>:8073)
  # Uncomment the devices/privileged lines and plug in the dongle first. See docs/06.
  openwebrx:
    image: jketterl/openwebrx:latest
    container_name: rom-openwebrx
    restart: unless-stopped
    profiles: ["radio"]
    ports:
      - "${OPENWEBRX_PORT:-8073}:8073"
    volumes:
      - openwebrx-config:/var/lib/openwebrx
    # --- RTL-SDR USB passthrough: uncomment once the dongle is connected ---
    # devices:
    #   - "/dev/bus/usb:/dev/bus/usb"
    # For a Meshtastic node wired to the box, pass its serial device to a script/container:
    #   devices:
    #     - "/dev/ttyUSB0:/dev/ttyUSB0"

volumes:
  ollama-models:
  qdrant-data:
  jellyfin-config:
  jellyfin-cache:
  openwebrx-config:
